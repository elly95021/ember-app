<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember — Screening Support Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.loading .message-content {
            background: #f0f0f0;
            color: #999;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #d32f2f;
            padding: 12px 16px;
            background: #ffebee;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>Screening Support Chat</h1>
            <p>Screening Support Chat</p>
        </div>
        
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Type your message..."
                    autocomplete="off"
                >
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        const group = getQueryParam('group');
        const pid = getQueryParam('pid') || '';
        const validGroups = ['ember', 'info'];
        const isValidGroup = validGroups.includes(group);
        const sessionId = generateSessionId();
        const sessionStart = new Date().toISOString();
        let conversation = [];

        function getQueryParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function generateSessionId() {
            if (window.crypto?.randomUUID) {
                return window.crypto.randomUUID();
            }
            return 's-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        }

        function addMessage(role, text, timestamp = new Date().toISOString(), includeInConversation = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            if (includeInConversation) {
                conversation.push({ role, content: text, timestamp });
            }
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message loading';
            messageDiv.id = 'loading-message';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = 'Ember is thinking...';
            
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeLoadingMessage() {
            const loading = document.getElementById('loading-message');
            if (loading) {
                loading.remove();
            }
        }

        async function sendMessage() {
            if (!isValidGroup) return;

            const message = userInput.value.trim();
            if (!message) return;

            sendBtn.disabled = true;
            userInput.value = '';

            addMessage('user', message);
            addLoadingMessage();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        conversation,
                        group,
                        pid,
                        sessionId,
                        sessionStart
                    })
                });

                removeLoadingMessage();

                if (!response.ok) {
                    const error = await response.json().catch(() => ({ error: 'Something went wrong' }));
                    addMessage('assistant', `Error: ${error.error || 'Something went wrong'}`);
                } else {
                    const data = await response.json();
                    addMessage('assistant', data.reply, data.timestamp || new Date().toISOString());
                }
            } catch (error) {
                removeLoadingMessage();
                addMessage('assistant', `Error: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function showInvalidGroupMessage() {
            addMessage(
                'assistant',
                'Please open this app from your study invitation link with the correct group assignment.',
                undefined,
                false
            );
            userInput.disabled = true;
            sendBtn.disabled = true;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        if (!isValidGroup) {
            showInvalidGroupMessage();
        } else {
            addMessage(
                'assistant',
                'Hi. I can help you with breast screening questions. What would you like to know?',
                undefined,
                false
            );
            userInput.focus();
        }
    </script>
</body>
</html>
